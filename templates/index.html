<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>数据字典导出系统 // 系统接入</title>
    <link href="https://fonts.googleapis.com/css2?family=Share+Tech+Mono&family=Orbitron:wght@400;700;900&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            min-height: 100vh;
            background: #0a0a0a;
            font-family: 'Share Tech Mono', monospace;
            color: #00ff9f;
            overflow: hidden;
            position: relative;
        }

        /* Matrix Rain Background */
        .matrix-bg {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 0;
            opacity: 0.15;
        }

        /* Scanlines */
        .scanlines {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 1;
            background: repeating-linear-gradient(
                0deg,
                rgba(0, 0, 0, 0.15),
                rgba(0, 0, 0, 0.15) 1px,
                transparent 1px,
                transparent 2px
            );
            pointer-events: none;
        }

        /* Glitch Effect Overlay */
        .glitch-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 2;
            background: linear-gradient(
                90deg,
                rgba(255, 0, 0, 0.03) 0%,
                rgba(0, 255, 255, 0.02) 50%,
                rgba(255, 0, 255, 0.03) 100%
            );
            animation: glitch-bg 0.3s infinite;
            pointer-events: none;
        }

        @keyframes glitch-bg {
            0% { opacity: 0.5; }
            50% { opacity: 0.8; }
            100% { opacity: 0.5; }
        }

        /* Grid Background */
        .grid-bg {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 0;
            background-image: 
                linear-gradient(rgba(0, 255, 159, 0.03) 1px, transparent 1px),
                linear-gradient(90deg, rgba(0, 255, 159, 0.03) 1px, transparent 1px);
            background-size: 50px 50px;
            animation: grid-move 20s linear infinite;
        }

        @keyframes grid-move {
            0% { transform: perspective(500px) rotateX(60deg) translateY(0); }
            100% { transform: perspective(500px) rotateX(60deg) translateY(50px); }
        }

        /* Main Container */
        .main-container {
            position: relative;
            z-index: 10;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 1rem;
        }

        /* Login Card */
        .login-card {
            width: 100%;
            max-width: 90vw;
            background: rgba(10, 10, 10, 0.95);
            border: 2px solid #00ff9f;
            position: relative;
            clip-path: polygon(
                0 0,
                calc(100% - 15px) 0,
                100% 15px,
                100% 100%,
                15px 100%,
                0 calc(100% - 15px)
            );
        }

        /* Neon Border Glow */
        .login-card::before {
            content: '';
            position: absolute;
            top: -2px;
            left: -2px;
            right: -2px;
            bottom: -2px;
            background: linear-gradient(45deg, #00ff9f, #00d4ff, #ff0099, #00ff9f);
            z-index: -1;
            filter: blur(20px);
            opacity: 0.5;
            animation: neon-pulse 2s ease-in-out infinite;
        }

        @keyframes neon-pulse {
            0%, 100% { opacity: 0.5; }
            50% { opacity: 0.8; }
        }

        /* Header */
        .card-header {
            background: linear-gradient(90deg, rgba(0, 255, 159, 0.1), transparent);
            border-bottom: 1px solid #00ff9f;
            padding: 1.5rem 1rem;
            text-align: center;
            position: relative;
        }

        .card-header::after {
            content: '';
            position: absolute;
            bottom: 0;
            left: 0;
            width: 100%;
            height: 1px;
            background: linear-gradient(90deg, transparent, #00ff9f, transparent);
            animation: scan-line 2s linear infinite;
        }

        @keyframes scan-line {
            0% { transform: translateX(-100%); }
            100% { transform: translateX(100%); }
        }

        .system-title {
            font-family: 'Orbitron', sans-serif;
            font-size: clamp(1rem, 4vw, 1.5rem);
            font-weight: 900;
            color: #00ff9f;
            text-transform: uppercase;
            letter-spacing: 2px;
            animation: glitch-text 3s infinite;
            position: relative;
        }

        .system-title::before,
        .system-title::after {
            content: '数据字典导出系统';
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
        }

        .system-title::before {
            color: #ff0099;
            animation: glitch-1 0.3s infinite;
            clip-path: polygon(0 0, 100% 0, 100% 35%, 0 35%);
            transform: translate(-2px);
        }

        .system-title::after {
            color: #00d4ff;
            animation: glitch-2 0.3s infinite;
            clip-path: polygon(0 65%, 100% 65%, 100% 100%, 0 100%);
            transform: translate(2px);
        }

        @keyframes glitch-1 {
            0%, 100% { transform: translate(0); }
            20% { transform: translate(-3px, 3px); }
            40% { transform: translate(-3px, -3px); }
            60% { transform: translate(3px, 3px); }
            80% { transform: translate(3px, -3px); }
        }

        @keyframes glitch-2 {
            0%, 100% { transform: translate(0); }
            20% { transform: translate(3px, -3px); }
            40% { transform: translate(3px, 3px); }
            60% { transform: translate(-3px, -3px); }
            80% { transform: translate(-3px, 3px); }
        }

        .subtitle {
            color: #00d4ff;
            font-size: clamp(0.7rem, 2vw, 0.85rem);
            margin-top: 0.5rem;
            opacity: 0.8;
        }

        /* Card Body */
        .card-body {
            padding: 1.5rem 1rem;
        }

        /* Alerts */
        .alert {
            padding: 1rem;
            margin-bottom: 1.5rem;
            border: 1px solid;
            background: rgba(0, 0, 0, 0.5);
            display: none;
        }

        .alert-success {
            border-color: #00ff9f;
            color: #00ff9f;
        }

        .alert-danger {
            border-color: #ff0055;
            color: #ff0055;
        }

        /* Form Elements */
        .form-section {
            margin-bottom: 1.5rem;
        }

        .form-label {
            display: block;
            color: #00d4ff;
            font-size: clamp(0.7rem, 2vw, 0.8rem);
            margin-bottom: 0.5rem;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        /* Database Type Selector */
        .db-selector {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 0.75rem;
            margin-bottom: 1rem;
        }

        .db-option {
            position: relative;
        }

        .db-option input {
            position: absolute;
            opacity: 0;
        }

        .db-option label {
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 1rem 0.5rem;
            background: rgba(0, 255, 159, 0.05);
            border: 1px solid rgba(0, 255, 159, 0.3);
            cursor: pointer;
            transition: all 0.3s;
            clip-path: polygon(8px 0, 100% 0, 100% calc(100% - 8px), calc(100% - 8px) 100%, 0 100%, 0 8px);
        }

        .db-option input:checked + label {
            background: rgba(0, 255, 159, 0.15);
            border-color: #00ff9f;
            box-shadow: 0 0 20px rgba(0, 255, 159, 0.3);
        }

        .db-option label:hover {
            border-color: #00d4ff;
            background: rgba(0, 212, 255, 0.1);
        }

        .db-icon {
            font-size: clamp(1.5rem, 5vw, 2rem);
            margin-bottom: 0.5rem;
        }

        .db-name {
            font-size: clamp(0.7rem, 2vw, 0.9rem);
            color: #00ff9f;
            text-transform: uppercase;
        }

        /* Input Fields */
        .input-group {
            margin-bottom: 0.875rem;
        }

        .cyber-input {
            width: 100%;
            background: rgba(0, 0, 0, 0.8);
            border: 1px solid rgba(0, 255, 159, 0.3);
            color: #00ff9f;
            padding: 0.75rem;
            font-family: 'Share Tech Mono', monospace;
            font-size: clamp(0.85rem, 2.5vw, 1rem);
            transition: all 0.3s;
            clip-path: polygon(5px 0, 100% 0, 100% calc(100% - 5px), calc(100% - 5px) 100%, 0 100%, 0 5px);
        }

        .cyber-input:focus {
            outline: none;
            border-color: #00ff9f;
            box-shadow: 0 0 15px rgba(0, 255, 159, 0.3), inset 0 0 15px rgba(0, 255, 159, 0.1);
            background: rgba(0, 255, 159, 0.05);
        }

        .cyber-input::placeholder {
            color: rgba(0, 255, 159, 0.4);
        }

        /* Buttons */
        .btn-group {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 0.75rem;
            margin-top: 1.5rem;
        }

        .cyber-btn {
            padding: 0.875rem 1rem;
            font-family: 'Orbitron', sans-serif;
            font-size: clamp(0.7rem, 2vw, 0.9rem);
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 1px;
            cursor: pointer;
            transition: all 0.3s;
            position: relative;
            overflow: hidden;
            clip-path: polygon(8px 0, 100% 0, 100% calc(100% - 8px), calc(100% - 8px) 100%, 0 100%, 0 8px);
        }

        .cyber-btn-primary {
            background: linear-gradient(90deg, #00ff9f, #00d4ff);
            border: none;
            color: #0a0a0a;
        }

        .cyber-btn-primary:hover {
            box-shadow: 0 0 30px rgba(0, 255, 159, 0.5);
            transform: translateY(-2px);
        }

        .cyber-btn-primary::before {
            content: '';
            position: absolute;
            top: 0;
            left: -100%;
            width: 100%;
            height: 100%;
            background: linear-gradient(90deg, transparent, rgba(255, 255, 255, 0.3), transparent);
            animation: btn-shine 3s infinite;
        }

        @keyframes btn-shine {
            0% { left: -100%; }
            50%, 100% { left: 100%; }
        }

        .cyber-btn-secondary {
            background: transparent;
            border: 1px solid #00d4ff;
            color: #00d4ff;
        }

        .cyber-btn-secondary:hover {
            background: rgba(0, 212, 255, 0.1);
            box-shadow: 0 0 20px rgba(0, 212, 255, 0.3);
        }

        .cyber-btn:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }

        /* Spinner */
        .spinner {
            display: inline-block;
            width: 1rem;
            height: 1rem;
            border: 2px solid transparent;
            border-top-color: currentColor;
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
            margin-right: 0.5rem;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        /* Status Bar */
        .status-bar {
            position: fixed;
            bottom: 0;
            left: 0;
            width: 100%;
            background: rgba(10, 10, 10, 0.95);
            border-top: 1px solid #00ff9f;
            padding: 0.5rem 1rem;
            z-index: 100;
            display: flex;
            justify-content: space-between;
            font-size: 0.75rem;
            color: rgba(0, 255, 159, 0.6);
        }

        .status-item {
            display: flex;
            align-items: center;
            gap: 0.5rem;
        }

        .status-dot {
            width: 8px;
            height: 8px;
            background: #00ff9f;
            border-radius: 50%;
            animation: pulse 1s infinite;
        }

        @keyframes pulse {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.5; }
        }

        /* Corner Decorations */
        .corner-deco {
            position: absolute;
            width: 30px;
            height: 30px;
            border: 2px solid #00ff9f;
        }

        .corner-deco.top-left {
            top: -5px;
            left: -5px;
            border-right: none;
            border-bottom: none;
        }

        .corner-deco.top-right {
            top: -5px;
            right: -5px;
            border-left: none;
            border-bottom: none;
        }

        .corner-deco.bottom-left {
            bottom: -5px;
            left: -5px;
            border-right: none;
            border-top: none;
        }

        .corner-deco.bottom-right {
            bottom: -5px;
            right: -5px;
            border-left: none;
            border-top: none;
        }

        /* Responsive */
        @media (max-width: 768px) {
            .db-selector {
                grid-template-columns: 1fr;
            }
            
            .btn-group {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>
<body>
    <!-- Matrix Background Canvas -->
    <canvas class="matrix-bg" id="matrix-canvas"></canvas>
    
    <!-- Grid Background -->
    <div class="grid-bg"></div>
    
    <!-- Scanlines -->
    <div class="scanlines"></div>
    
    <!-- Glitch Overlay -->
    <div class="glitch-overlay"></div>

    <!-- Main Container -->
    <div class="main-container">
        <div class="login-card">
            <div class="corner-deco top-left"></div>
            <div class="corner-deco top-right"></div>
            <div class="corner-deco bottom-left"></div>
            <div class="corner-deco bottom-right"></div>

            <div class="card-header">
                <div class="system-title">数据字典导出系统</div>
                <div class="subtitle">// 系统接入端口 v2.0.6</div>
            </div>

            <div class="card-body">
                <!-- Alerts -->
                <div id="alert-error" class="alert alert-danger" role="alert">
                    <strong>[错误]</strong> <span id="error-message"></span>
                </div>
                
                <div id="alert-success" class="alert alert-success" role="alert">
                    <strong>[成功]</strong> <span id="success-message"></span>
                </div>

                <form id="connect-form">
                    <!-- Database Type -->
                    <div class="form-section">
                        <label class="form-label">[选择数据库类型]</label>
                        <div class="db-selector">
                            <div class="db-option">
                                <input type="radio" id="db-mysql" name="db_type" value="mysql" checked>
                                <label for="db-mysql">
                                    <span class="db-icon">🐬</span>
                                    <span class="db-name">MySQL</span>
                                </label>
                            </div>
                            <div class="db-option">
                                <input type="radio" id="db-postgresql" name="db_type" value="postgresql">
                                <label for="db-postgresql">
                                    <span class="db-icon">🐘</span>
                                    <span class="db-name">PostgreSQL</span>
                                </label>
                            </div>
                            <div class="db-option">
                                <input type="radio" id="db-oracle" name="db_type" value="oracle">
                                <label for="db-oracle">
                                    <span class="db-icon">📦</span>
                                    <span class="db-name">Oracle</span>
                                </label>
                            </div>
                        </div>
                    </div>

                    <!-- Connection Parameters -->
                    <div class="form-section">
                        <div style="display: grid; grid-template-columns: 2fr 1fr; gap: 1rem;">
                            <div class="input-group">
                                <label class="form-label" for="host">[主机地址]</label>
                                <input type="text" class="cyber-input" id="host" name="host" placeholder="localhost" required>
                            </div>
                            <div class="input-group">
                                <label class="form-label" for="port">[端口]</label>
                                <input type="number" class="cyber-input" id="port" name="port" value="3306" required>
                            </div>
                        </div>

                        <div class="input-group">
                            <label class="form-label" for="user">[用户名]</label>
                            <input type="text" class="cyber-input" id="user" name="user" placeholder="root" required>
                        </div>

                        <div class="input-group">
                            <label class="form-label" for="password">[密码]</label>
                            <input type="password" class="cyber-input" id="password" name="password" placeholder="••••••••" required>
                        </div>

                        <div class="input-group">
                            <label class="form-label" for="database">[数据库名称]</label>
                            <input type="text" class="cyber-input" id="database" name="database" placeholder="请输入数据库名称" required>
                        </div>
                    </div>

                    <!-- Buttons -->
                    <div class="btn-group">
                        <button type="button" id="btn-test" class="cyber-btn cyber-btn-secondary">
                            <span class="spinner" style="display: none;"></span>
                            测试连接
                        </button>
                        <button type="button" id="btn-connect" class="cyber-btn cyber-btn-primary">
                            <span class="spinner" style="display: none;"></span>
                            开始导出
                        </button>
                    </div>
                </form>
            </div>
        </div>
    </div>

    <!-- Status Bar -->
    <div class="status-bar">
        <div class="status-item">
            <div class="status-dot"></div>
            <span>系统状态: 在线</span>
        </div>
        <div class="status-item">
            <span>加密方式: AES-256</span>
        </div>
        <div class="status-item">
            <span id="current-time">00:00:00</span>
        </div>
    </div>

    <script src="/static/js/app.js"></script>
    <script>
        // Matrix Rain Effect
        const canvas = document.getElementById('matrix-canvas');
        const ctx = canvas.getContext('2d');

        canvas.width = window.innerWidth;
        canvas.height = window.innerHeight;

        const chars = 'ABCDEFGHIJKLMNOPQRSTUVWXYZ0123456789@#$%^&*()';
        const fontSize = 14;
        const columns = canvas.width / fontSize;
        const drops = Array(Math.floor(columns)).fill(1);

        function drawMatrix() {
            ctx.fillStyle = 'rgba(0, 0, 0, 0.05)';
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            ctx.fillStyle = '#00ff9f';
            ctx.font = fontSize + 'px Share Tech Mono';

            for (let i = 0; i < drops.length; i++) {
                const text = chars[Math.floor(Math.random() * chars.length)];
                ctx.fillText(text, i * fontSize, drops[i] * fontSize);

                if (drops[i] * fontSize > canvas.height && Math.random() > 0.975) {
                    drops[i] = 0;
                }
                drops[i]++;
            }
        }

        setInterval(drawMatrix, 35);

        // Update Time
        function updateTime() {
            const now = new Date();
            const timeStr = now.toLocaleTimeString('en-US', { hour12: false });
            document.getElementById('current-time').textContent = timeStr;
        }
        setInterval(updateTime, 1000);
        updateTime();

        // Resize Handler
        window.addEventListener('resize', () => {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
        });
    </script>
</body>
</html>
