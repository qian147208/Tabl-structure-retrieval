<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>表选择 // 数据导出</title>
    <link href="https://fonts.googleapis.com/css2?family=Share+Tech+Mono&family=Orbitron:wght@400;700;900&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            min-height: 100vh;
            background: #0a0a0a;
            font-family: 'Share Tech Mono', monospace;
            color: #00ff9f;
            overflow-x: hidden;
        }

        /* Matrix Background */
        .matrix-bg {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 0;
            opacity: 0.1;
        }

        /* Scanlines */
        .scanlines {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 1;
            background: repeating-linear-gradient(
                0deg,
                rgba(0, 0, 0, 0.1),
                rgba(0, 0, 0, 0.1) 1px,
                transparent 1px,
                transparent 2px
            );
            pointer-events: none;
        }

        /* Grid Background */
        .grid-bg {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 0;
            background-image: 
                linear-gradient(rgba(0, 255, 159, 0.02) 1px, transparent 1px),
                linear-gradient(90deg, rgba(0, 255, 159, 0.02) 1px, transparent 1px);
            background-size: 40px 40px;
        }

        /* Main Container */
        .main-container {
            position: relative;
            z-index: 10;
            max-width: 1000px;
            margin: 0 auto;
            padding: 1rem;
        }

        /* Header Bar */
        .header-bar {
            background: rgba(10, 10, 10, 0.95);
            border: 1px solid #00ff9f;
            padding: 0.875rem 1rem;
            margin-bottom: 1rem;
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 0.75rem;
            clip-path: polygon(0 0, calc(100% - 12px) 0, 100% 12px, 100% 100%, 12px 100%, 0 calc(100% - 12px));
            position: relative;
        }

        .header-bar::before {
            content: '';
            position: absolute;
            top: -1px;
            left: -1px;
            right: -1px;
            bottom: -1px;
            background: linear-gradient(45deg, #00ff9f, #00d4ff);
            z-index: -1;
            filter: blur(10px);
            opacity: 0.3;
        }

        .system-logo {
            font-family: 'Orbitron', sans-serif;
            font-size: clamp(0.8rem, 3vw, 1rem);
            font-weight: 700;
            color: #00ff9f;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .connection-info {
            display: flex;
            align-items: center;
            gap: 0.75rem;
        }

        .db-status {
            background: rgba(0, 255, 159, 0.1);
            border: 1px solid #00ff9f;
            padding: 0.5rem 0.875rem;
            font-size: clamp(0.7rem, 2vw, 0.8rem);
            color: #00ff9f;
        }

        .disconnect-btn {
            background: transparent;
            border: 1px solid #ff0055;
            color: #ff0055;
            padding: 0.5rem 0.875rem;
            font-family: 'Orbitron', sans-serif;
            font-size: clamp(0.7rem, 2vw, 0.75rem);
            cursor: pointer;
            transition: all 0.3s;
            text-transform: uppercase;
        }

        .disconnect-btn:hover {
            background: rgba(255, 0, 85, 0.2);
            box-shadow: 0 0 15px rgba(255, 0, 85, 0.3);
        }

        /* Main Card */
        .main-card {
            background: rgba(10, 10, 10, 0.95);
            border: 1px solid #00ff9f;
            position: relative;
            clip-path: polygon(0 0, calc(100% - 15px) 0, 100% 15px, 100% calc(100% - 15px), calc(100% - 15px) 100%, 0 100%);
        }

        .main-card::before {
            content: '';
            position: absolute;
            top: -1px;
            left: -1px;
            right: -1px;
            bottom: -1px;
            background: linear-gradient(45deg, #00ff9f, #00d4ff, #ff0099);
            z-index: -1;
            filter: blur(15px);
            opacity: 0.3;
        }

        /* Card Header */
        .card-header {
            background: linear-gradient(90deg, rgba(0, 255, 159, 0.1), transparent);
            border-bottom: 1px solid rgba(0, 255, 159, 0.3);
            padding: 1rem;
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 0.75rem;
        }

        .card-title {
            font-family: 'Orbitron', sans-serif;
            font-size: clamp(0.9rem, 3vw, 1.25rem);
            font-weight: 700;
            color: #00ff9f;
            text-transform: uppercase;
        }

        .selection-counter {
            background: linear-gradient(90deg, #00ff9f, #00d4ff);
            color: #0a0a0a;
            padding: 0.5rem 1rem;
            font-family: 'Orbitron', sans-serif;
            font-size: clamp(0.7rem, 2vw, 0.85rem);
            font-weight: 700;
            clip-path: polygon(6px 0, 100% 0, 100% calc(100% - 6px), calc(100% - 6px) 100%, 0 100%, 0 6px);
        }

        /* Search Section */
        .search-section {
            padding: 1rem;
            background: rgba(0, 0, 0, 0.3);
            border-bottom: 1px solid rgba(0, 255, 159, 0.2);
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 0.75rem;
        }

        .search-box {
            flex: 1;
            min-width: 200px;
            max-width: 400px;
            position: relative;
        }

        .search-input {
            width: 100%;
            background: rgba(0, 0, 0, 0.8);
            border: 1px solid rgba(0, 255, 159, 0.3);
            color: #00ff9f;
            padding: 0.625rem 2rem 0.625rem 0.875rem;
            font-family: 'Share Tech Mono', monospace;
            font-size: clamp(0.8rem, 2vw, 0.9rem);
        }

        .search-input:focus {
            outline: none;
            border-color: #00ff9f;
            box-shadow: 0 0 10px rgba(0, 255, 159, 0.2);
        }

        .search-icon {
            position: absolute;
            right: 0.75rem;
            top: 50%;
            transform: translateY(-50%);
            color: #00d4ff;
            font-size: 1rem;
        }

        .action-buttons {
            display: flex;
            gap: 0.625rem;
        }

        .cyber-btn-small {
            background: transparent;
            border: 1px solid #00d4ff;
            color: #00d4ff;
            padding: 0.5rem 0.875rem;
            font-family: 'Orbitron', sans-serif;
            font-size: clamp(0.65rem, 1.5vw, 0.75rem);
            cursor: pointer;
            transition: all 0.3s;
            text-transform: uppercase;
        }

        .cyber-btn-small:hover {
            background: rgba(0, 212, 255, 0.1);
            box-shadow: 0 0 10px rgba(0, 212, 255, 0.2);
        }

        /* Table List */
        .table-list {
            padding: 1rem;
            max-height: 50vh;
            overflow-y: auto;
        }

        .table-list::-webkit-scrollbar {
            width: 8px;
        }

        .table-list::-webkit-scrollbar-track {
            background: rgba(0, 0, 0, 0.5);
        }

        .table-list::-webkit-scrollbar-thumb {
            background: #00ff9f;
            border-radius: 4px;
        }

        .table-item {
            display: flex;
            align-items: center;
            padding: 0.75rem;
            margin-bottom: 0.5rem;
            background: rgba(0, 255, 159, 0.03);
            border: 1px solid rgba(0, 255, 159, 0.2);
            cursor: pointer;
            transition: all 0.2s;
        }

        .table-item:hover {
            background: rgba(0, 212, 255, 0.05);
            border-color: #00d4ff;
            transform: translateX(5px);
        }

        .table-item.selected {
            background: rgba(0, 255, 159, 0.1);
            border-color: #00ff9f;
            box-shadow: inset 0 0 20px rgba(0, 255, 159, 0.1);
        }

        .table-checkbox {
            width: 18px;
            height: 18px;
            border: 2px solid rgba(0, 255, 159, 0.5);
            margin-right: 0.875rem;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.2s;
        }

        .table-item.selected .table-checkbox {
            background: #00ff9f;
            border-color: #00ff9f;
        }

        .table-checkbox::after {
            content: '✓';
            color: #0a0a0a;
            font-size: 0.75rem;
            font-weight: bold;
            opacity: 0;
        }

        .table-item.selected .table-checkbox::after {
            opacity: 1;
        }

        .table-icon {
            color: #00d4ff;
            margin-right: 0.875rem;
            font-size: 1.125rem;
        }

        .table-name {
            color: #00ff9f;
            font-size: clamp(0.8rem, 2vw, 0.9rem);
            flex: 1;
            word-break: break-all;
        }

        /* Footer Section */
        .footer-section {
            padding: 1rem;
            background: rgba(0, 0, 0, 0.3);
            border-top: 1px solid rgba(0, 255, 159, 0.3);
        }

        .export-options {
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 1rem;
            margin-bottom: 1rem;
        }

        .format-selector {
            display: flex;
            gap: 0.75rem;
            flex-wrap: wrap;
        }

        .format-option {
            display: flex;
            align-items: center;
            gap: 0.5rem;
            padding: 0.625rem 1rem;
            background: rgba(0, 0, 0, 0.5);
            border: 1px solid rgba(0, 255, 159, 0.3);
            cursor: pointer;
            transition: all 0.3s;
        }

        .format-option:hover {
            border-color: #00d4ff;
        }

        .format-option.active {
            border-color: #00ff9f;
            background: rgba(0, 255, 159, 0.1);
            box-shadow: 0 0 10px rgba(0, 255, 159, 0.2);
        }

        .format-option input {
            display: none;
        }

        .format-label {
            color: #00ff9f;
            font-size: clamp(0.75rem, 2vw, 0.85rem);
        }

        .export-btn {
            background: linear-gradient(90deg, #00ff9f, #00d4ff);
            border: none;
            color: #0a0a0a;
            padding: 0.875rem 1.5rem;
            font-family: 'Orbitron', sans-serif;
            font-size: clamp(0.75rem, 2vw, 0.9rem);
            font-weight: 700;
            cursor: pointer;
            transition: all 0.3s;
            text-transform: uppercase;
            letter-spacing: 1px;
            position: relative;
            overflow: hidden;
        }

        .export-btn:hover {
            box-shadow: 0 0 30px rgba(0, 255, 159, 0.5);
            transform: translateY(-2px);
        }

        .export-btn::before {
            content: '';
            position: absolute;
            top: 0;
            left: -100%;
            width: 100%;
            height: 100%;
            background: linear-gradient(90deg, transparent, rgba(255, 255, 255, 0.4), transparent);
            animation: btn-shine 2s infinite;
        }

        @keyframes btn-shine {
            0% { left: -100%; }
            50%, 100% { left: 100%; }
        }

        /* Progress Section */
        .progress-section {
            margin-top: 1rem;
            padding: 1rem;
            background: rgba(0, 0, 0, 0.5);
            border: 1px solid rgba(0, 255, 159, 0.3);
            display: none;
        }

        .progress-section.show {
            display: block;
        }

        .progress-header {
            display: flex;
            justify-content: space-between;
            margin-bottom: 0.5rem;
            font-size: 0.85rem;
        }

        .progress-bar-container {
            height: 8px;
            background: rgba(0, 0, 0, 0.8);
            border: 1px solid rgba(0, 255, 159, 0.3);
            overflow: hidden;
        }

        .progress-bar {
            height: 100%;
            background: linear-gradient(90deg, #00ff9f, #00d4ff);
            width: 0%;
            transition: width 0.3s;
        }

        /* Empty State */
        .empty-state {
            text-align: center;
            padding: 3rem 2rem;
            color: rgba(0, 255, 159, 0.5);
        }

        .empty-icon {
            font-size: 3rem;
            margin-bottom: 1rem;
            animation: pulse 2s infinite;
        }

        @keyframes pulse {
            0%, 100% { opacity: 0.5; }
            50% { opacity: 1; }
        }

        /* Result Modal */
        .modal-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.8);
            z-index: 1000;
            display: none;
            justify-content: center;
            align-items: center;
        }

        .modal-overlay.show {
            display: flex;
        }

        .modal-content {
            background: rgba(10, 10, 10, 0.95);
            border: 2px solid #00ff9f;
            max-width: 500px;
            width: 90%;
            padding: 2rem;
            position: relative;
            clip-path: polygon(0 0, calc(100% - 20px) 0, 100% 20px, 100% 100%, 20px 100%, 0 100%);
        }

        .modal-content::before {
            content: '';
            position: absolute;
            top: -2px;
            left: -2px;
            right: -2px;
            bottom: -2px;
            background: linear-gradient(45deg, #00ff9f, #00d4ff);
            z-index: -1;
            filter: blur(15px);
            opacity: 0.4;
        }

        .modal-header {
            font-family: 'Orbitron', sans-serif;
            font-size: 1.25rem;
            color: #00ff9f;
            margin-bottom: 1.5rem;
            text-transform: uppercase;
        }

        .file-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 1rem;
            background: rgba(0, 255, 159, 0.05);
            border: 1px solid rgba(0, 255, 159, 0.2);
            margin-bottom: 0.75rem;
        }

        .file-info {
            display: flex;
            align-items: center;
            gap: 1rem;
        }

        .file-icon {
            font-size: 1.5rem;
            color: #00d4ff;
        }

        .file-name {
            color: #00ff9f;
            font-size: 0.9rem;
        }

        .download-link {
            background: linear-gradient(90deg, #00ff9f, #00d4ff);
            color: #0a0a0a;
            padding: 0.5rem 1rem;
            font-family: 'Orbitron', sans-serif;
            font-size: 0.75rem;
            text-decoration: none;
            text-transform: uppercase;
        }

        .modal-close {
            background: transparent;
            border: 1px solid #00d4ff;
            color: #00d4ff;
            padding: 0.75rem 1.5rem;
            font-family: 'Orbitron', sans-serif;
            font-size: 0.85rem;
            cursor: pointer;
            margin-top: 1.5rem;
            width: 100%;
            text-transform: uppercase;
        }

        .modal-close:hover {
            background: rgba(0, 212, 255, 0.1);
        }

        /* Status Bar */
        .status-bar {
            position: fixed;
            bottom: 0;
            left: 0;
            width: 100%;
            background: rgba(10, 10, 10, 0.95);
            border-top: 1px solid #00ff9f;
            padding: 0.5rem 1rem;
            z-index: 100;
            display: flex;
            justify-content: space-between;
            font-size: 0.75rem;
            color: rgba(0, 255, 159, 0.6);
        }

        .status-item {
            display: flex;
            align-items: center;
            gap: 0.5rem;
        }

        .status-dot {
            width: 8px;
            height: 8px;
            background: #00ff9f;
            border-radius: 50%;
            animation: blink 1s infinite;
        }

        @keyframes blink {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.3; }
        }

        /* Spinner */
        .spinner {
            display: inline-block;
            width: 1rem;
            height: 1rem;
            border: 2px solid transparent;
            border-top-color: currentColor;
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
            margin-right: 0.5rem;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        /* Responsive */
        @media (max-width: 768px) {
            .header-bar {
                flex-direction: column;
                gap: 1rem;
            }
            
            .search-section {
                flex-direction: column;
            }
            
            .search-box {
                max-width: 100%;
            }
            
            .export-options {
                flex-direction: column;
                gap: 1rem;
            }
            
            .format-selector {
                flex-direction: column;
            }
        }
    </style>
</head>
<body>
    <!-- Matrix Background -->
    <canvas class="matrix-bg" id="matrix-canvas"></canvas>
    
    <!-- Grid Background -->
    <div class="grid-bg"></div>
    
    <!-- Scanlines -->
    <div class="scanlines"></div>

    <!-- Main Container -->
    <div class="main-container">
        <!-- Header Bar -->
        <div class="header-bar">
            <div class="system-logo">数据字典导出系统</div>
            <div class="connection-info">
                <div class="db-status" id="db-info">
                    <span id="db-name">连接中...</span>
                </div>
                <button class="disconnect-btn" id="btn-disconnect">
                    断开连接
                </button>
            </div>
        </div>

        <!-- Main Card -->
        <div class="main-card">
            <!-- Card Header -->
            <div class="card-header">
                <div class="card-title">表选择器</div>
                <div class="selection-counter" id="selected-count">已选择: 0</div>
            </div>

            <!-- Search Section -->
            <div class="search-section">
                <div class="search-box">
                    <input type="text" class="search-input" id="search-input" placeholder="搜索表...">
                    <span class="search-icon">🔍</span>
                </div>
                <div class="action-buttons">
                    <button class="cyber-btn-small" id="btn-select-all">全选</button>
                    <button class="cyber-btn-small" id="btn-deselect-all">清除选择</button>
                </div>
            </div>

            <!-- Table List -->
            <div class="table-list" id="table-list">
                <div class="empty-state">
                    <div class="empty-icon">⏳</div>
                    <div>加载表中...</div>
                </div>
            </div>

            <!-- Footer Section -->
            <div class="footer-section">
                <div class="export-options">
                    <div class="format-selector">
                        <label class="format-option active" id="format-both">
                            <input type="radio" name="export-format" value="both" checked>
                            <span class="format-label">CSV + Excel</span>
                        </label>
                        <label class="format-option" id="format-csv">
                            <input type="radio" name="export-format" value="csv">
                            <span class="format-label">仅 CSV</span>
                        </label>
                        <label class="format-option" id="format-excel">
                            <input type="radio" name="export-format" value="excel">
                            <span class="format-label">仅 Excel</span>
                        </label>
                    </div>
                    <button class="export-btn" id="btn-export">
                        <span class="spinner" style="display: none;"></span>
                        开始导出
                    </button>
                </div>

                <!-- Progress Section -->
                <div class="progress-section" id="progress-section">
                    <div class="progress-header">
                        <span>导出进度</span>
                        <span id="progress-text">0%</span>
                    </div>
                    <div class="progress-bar-container">
                        <div class="progress-bar" id="progress-bar"></div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- Result Modal -->
    <div class="modal-overlay" id="result-modal">
        <div class="modal-content">
            <div class="modal-header">[导出完成]</div>
            <div id="result-content">
                <p style="color: rgba(0, 255, 159, 0.7); margin-bottom: 1rem;">文件已准备好下载:</p>
            </div>
            <button class="modal-close" onclick="closeModal()">关闭窗口</button>
        </div>
    </div>

    <!-- Status Bar -->
    <div class="status-bar">
        <div class="status-item">
            <div class="status-dot"></div>
            <span>系统状态: 活跃</span>
        </div>
        <div class="status-item">
            <span>传输协议: 安全</span>
        </div>
        <div class="status-item">
            <span id="current-time">00:00:00</span>
        </div>
    </div>

    <script src="/static/js/app.js"></script>
    <script>
        // Matrix Rain
        const canvas = document.getElementById('matrix-canvas');
        const ctx = canvas.getContext('2d');

        canvas.width = window.innerWidth;
        canvas.height = window.innerHeight;

        const chars = 'ABCDEFGHIJKLMNOPQRSTUVWXYZ0123456789@#$%^&*()';
        const fontSize = 12;
        const columns = canvas.width / fontSize;
        const drops = Array(Math.floor(columns)).fill(1);

        function drawMatrix() {
            ctx.fillStyle = 'rgba(0, 0, 0, 0.05)';
            ctx.fillRect(0, 0, canvas.width, canvas.height);
            ctx.fillStyle = '#00ff9f';
            ctx.font = fontSize + 'px Share Tech Mono';

            for (let i = 0; i < drops.length; i++) {
                const text = chars[Math.floor(Math.random() * chars.length)];
                ctx.fillText(text, i * fontSize, drops[i] * fontSize);
                if (drops[i] * fontSize > canvas.height && Math.random() > 0.975) {
                    drops[i] = 0;
                }
                drops[i]++;
            }
        }

        setInterval(drawMatrix, 50);

        // Time Update
        function updateTime() {
            const now = new Date();
            document.getElementById('current-time').textContent = now.toLocaleTimeString('en-US', { hour12: false });
        }
        setInterval(updateTime, 1000);
        updateTime();

        // Resize
        window.addEventListener('resize', () => {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
        });

        // Modal Close
        function closeModal() {
            document.getElementById('result-modal').classList.remove('show');
        }
    </script>
</body>
</html>
